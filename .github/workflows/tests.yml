name: Basic Project Tests
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Perform unit tests with Python ${{ matrix.python_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install needed tools
        run: |
          sudo apt update
          sudo apt install python3-bpfcc

      - name: Setup python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}

      - name: Copy distribution BPF packages
        run: cp -av /usr/lib/python3/dist-packages/bcc* $(python -c "import sysconfig; print(sysconfig.get_path('platlib'))")

      - name: Install package
        run: python -m pip install .

      - name: Install development requirements
        run: python -m pip install -r requirements_dev.txt

      - name: Execute unit tests
        run: pytest

  linter:
    name: Run Linter and check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install needed tools
        run: |
          sudo apt update
          sudo apt install clang-format

      - name: Install development requirements
        run: python -m pip install -r requirements_dev.txt

      - name: Run ruff linter
        run: ruff check src tests

      - name: Check code format with ruff
        run: ruff format --check --diff src tests

      - name: Run clang-format
        run: clang-format --dry-run --Werror src/pg_lock_tracer/bpf/*.c
